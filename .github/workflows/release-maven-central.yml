name: Release to Maven Central

# Trigger on version tags.
# Requires these GitHub repository secrets:
#   MAVEN_CENTRAL_USERNAME  — Sonatype Central Portal username
#   MAVEN_CENTRAL_PASSWORD  — Sonatype Central Portal password/token
#   GPG_PRIVATE_KEY         — ASCII-armored GPG private key
#   GPG_PASSPHRASE          — Passphrase for the GPG key
#
# Setup instructions:
#   1. Create a Sonatype Central Portal account at https://central.sonatype.com
#   2. Verify namespace ownership for io.github.arthurhoch
#   3. Generate a GPG key pair and export the private key:
#      gpg --armor --export-secret-keys YOUR_KEY_ID
#   4. Add the four secrets above in GitHub Settings > Secrets and variables > Actions
#   5. Tag a release: git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD

      - name: Import GPG key
        run: echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --dearmor --output /tmp/gpg-key.gpg && gpg --batch --import /tmp/gpg-key.gpg
        env:
          GPG_TTY: /dev/null

      - name: Run tests
        run: mvn -B verify

      - name: Publish to Maven Central
        run: mvn -B deploy -Prelease -Dgpg.passphrase="${GPG_PASSPHRASE}"
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
